# Test configuration for validating the secure nginx deployment
# This file can be used to test the deployment in a development environment

apiVersion: v1
kind: Namespace
metadata:
  name: nginx-test
  labels:
    name: nginx-test
    security.kubernetes.io/enforce: restricted
---
# Test pod to validate security configurations
apiVersion: v1
kind: Pod
metadata:
  name: nginx-security-test
  namespace: nginx-test
  labels:
    app: nginx-test
spec:
  serviceAccountName: nginx-service-account
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: nginx-test
    image: nginx:1.25.3-alpine
    imagePullPolicy: Always
    ports:
    - containerPort: 80
      name: http
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      capabilities:
        drop:
        - ALL
        add:
        - NET_BIND_SERVICE
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
    volumeMounts:
    - name: nginx-cache
      mountPath: /var/cache/nginx
    - name: nginx-run
      mountPath: /var/run
    - name: nginx-tmp
      mountPath: /tmp
  volumes:
  - name: nginx-cache
    emptyDir: {}
  - name: nginx-run
    emptyDir: {}
  - name: nginx-tmp
    emptyDir: {}
  restartPolicy: Never